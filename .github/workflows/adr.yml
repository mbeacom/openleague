name: Architecture Decision Records

on:
  # Must stay `pull_request`. The governing-decisions job below holds
  # `pull-requests: write`; switching to `pull_request_target` would combine
  # that write token with a checkout of untrusted fork code. Fork PRs get a
  # read-only token here, so the comment step catches the 403, writes the body
  # to a notice annotation and returns without failing -- see `comment()` and
  # `isPermissionError` in the pinned action. That is the intended behaviour,
  # not a bug to "fix" by changing the trigger. Read from the action's source
  # and never observed here; see #306 and ADR-0001 action item 8.
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: adr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate the decision corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      # --ignore-scripts skips the Prisma postinstall, which needs a
      # DATABASE_URL that linting markdown records has no use for.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint ADR corpus
        run: bun run adr:lint

      # `adr lint` exits 0 on an empty corpus and only warns on a record whose
      # filename stops being discoverable, so either would merge green. This
      # also holds the four committed adrkit version pins to one value.
      - name: Check ADR corpus and version-pin integrity
        run: bun run adr:check-integrity

  # Enforcement of a decision, not validation of the corpus, so it is a job of
  # its own rather than a step in `lint`. It lives in this workflow because
  # this workflow runs on pull requests: `bun run lint` -- which carries the
  # equivalent ESLint rules -- runs only in release.yml and tag-release.yml,
  # both push-triggered, so an ESLint rule alone would let a violation merge
  # green and break the release pipeline afterwards. See #310.
  raw-sql:
    name: Enforce the ADR-0003 raw-SQL prohibition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      # No `bun install`: the check imports only node: builtins, precisely so
      # it cannot be defeated by a dependency or install failure.
      - name: Check for prohibited raw SQL
        run: bun run check:raw-sql

  governing-decisions:
    name: Comment governing decisions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Pinned to the immutable v0.7.0 commit rather than the moving @v0 tag,
      # matching the ADR-0001 decision to pin adrkit exactly.
      - name: Resolve decisions governing this pull request
        uses: mbeacom/adrkit/packages/ci@e3155eaaf200c9ed7f3ea572d91f0bd4c11c35cc # v0.7.0
        env:
          # Inert as pinned, and safe to delete. Through v0.6.0 the action
          # recognised its own comment only when the resolved token equalled
          # $GITHUB_TOKEN, which Actions does not export, so without this block
          # the marker lookup was skipped and every push appended another
          # comment (adrkit #107). v0.7.0 deleted that comparison: it now reads
          # a refused `users.getAuthenticated` call as an app-installation
          # token and claims its prior comment on `user.type == 'Bot'` plus the
          # marker leading the body (adrkit ADR-0026). The variable survives
          # only as a fallback *source* -- `getInput('token') ||
          # process.env.GITHUB_TOKEN` -- and `with: token:` below is always
          # set, so this is never read.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dir: docs/adr
          token: ${{ github.token }}
