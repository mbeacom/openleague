name: Documentation Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app/docs/**'
      - 'components/features/docs/**'
      - 'docs/**'
      - 'lib/docs/**'
      # The static planner (ADR-0020) bundles shared components, utilities and
      # types, so any of them can change the deployed /planner/ build.
      - 'apps/planner/**'
      - 'components/**'
      - 'lib/**'
      - 'types/**'
      - 'app/(dashboard)/practice-planner/**'
      - 'app/(print)/**'
      - 'scripts/check-planner-build.ts'
      # Only top-level docs/*.md are published, so ADR records cannot change
      # the built site. Excluded to avoid a no-op Pages deploy per record.
      - '!docs/adr/**'
      - 'scripts/build-docs-pages.ts'
      - '.github/workflows/docs-pages.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    # The planner's cloud connector identifiers (storage connectors spec R9) are
    # github-pages environment variables and a secret, which only a job that
    # names the environment can read. deployment: false reads them without
    # recording a second deployment; the deploy job below records the real one.
    environment:
      name: github-pages
      deployment: false
    env:
      # Prisma client generation runs during bun install. A real secret is used
      # when available; the fallback only satisfies generate-time URL parsing.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/openleague_ci' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs pages artifact
        run: bun run docs:build-pages

      # Cloud saving (storage connectors spec R9): each connector is built in only
      # when its public identifiers are set, and the bundle check must see the
      # same values to verify the CSP. The API key is a referrer-restricted
      # browser key that ships in the page; it is a secret only to keep it out
      # of logs. Unset values (forks) build the planner without cloud saving.
      - name: Build the static planner
        run: bun run planner:build
        env:
          OPENLEAGUE_GOOGLE_CLIENT_ID: ${{ vars.OPENLEAGUE_GOOGLE_CLIENT_ID }}
          OPENLEAGUE_GOOGLE_APP_ID: ${{ vars.OPENLEAGUE_GOOGLE_APP_ID }}
          OPENLEAGUE_GOOGLE_API_KEY: ${{ secrets.OPENLEAGUE_GOOGLE_API_KEY }}
          OPENLEAGUE_MICROSOFT_CLIENT_ID: ${{ vars.OPENLEAGUE_MICROSOFT_CLIENT_ID }}

      - name: Check the static planner bundle
        run: bun run planner:check
        env:
          OPENLEAGUE_GOOGLE_CLIENT_ID: ${{ vars.OPENLEAGUE_GOOGLE_CLIENT_ID }}
          OPENLEAGUE_GOOGLE_APP_ID: ${{ vars.OPENLEAGUE_GOOGLE_APP_ID }}
          OPENLEAGUE_GOOGLE_API_KEY: ${{ secrets.OPENLEAGUE_GOOGLE_API_KEY }}
          OPENLEAGUE_MICROSOFT_CLIENT_ID: ${{ vars.OPENLEAGUE_MICROSOFT_CLIENT_ID }}

      # The docs build empties dist/docs-pages first, so the planner goes in last.
      - name: Add the planner to the Pages artifact
        run: cp -R dist/planner dist/docs-pages/planner

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # The stock Pages upload action drops every dot-path (--exclude=".[^/]*"), which would
      # leave out /.well-known/ (the Microsoft identity association file). This archives the
      # site the same way, keeping dot-paths, and uploads it under the name deploy-pages reads.
      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference --directory dist/docs-pages \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './.well-known/microsoft-identity-association.json'

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy documentation site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
